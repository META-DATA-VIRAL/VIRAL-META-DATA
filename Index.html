<body>

<div class="container">

<div class="logo">

🚀 AI Viral Metadata Generator PRO

</div>

<div class="subtitle">

Generate High CTR Titles • SEO Description • Viral Hashtags using Gemini AI

</div>

<form id="uploadForm">

<div class="card">

<label>Gemini API Key</label>

📝 SEO Description

Copy

</button>

🏷 Viral Tags

<script>

const uploadBox = document.querySelector(".upload");
const fileInput = document.getElementById("video");
const preview = document.querySelector(".preview");
const previewVideo = document.getElementById("previewVideo");

const progress = document.querySelector(".progress");
const progressFill = document.querySelector(".progress-fill");

const form = document.getElementById("uploadForm");


// Click Upload Box
uploadBox.addEventListener("click",()=>{

fileInput.click();

});


// File Selected
fileInput.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(file){

showPreview(file);

}

});


// Drag Events

uploadBox.addEventListener("dragover",(e)=>{

e.preventDefault();

uploadBox.style.borderColor="#00d4ff";

uploadBox.style.background="rgba(0,212,255,.08)";

});


uploadBox.addEventListener("dragleave",()=>{

uploadBox.style.borderColor="rgba(255,255,255,.2)";

uploadBox.style.background="transparent";

});


uploadBox.addEventListener("drop",(e)=>{

e.preventDefault();

uploadBox.style.borderColor="rgba(255,255,255,.2)";

uploadBox.style.background="transparent";

const file=e.dataTransfer.files[0];

if(file){

fileInput.files=e.dataTransfer.files;

showPreview(file);

}

});



// Preview Function

function showPreview(file){

const url=URL.createObjectURL(file);

previewVideo.src=url;

preview.style.display="block";

}



// Progress Animation

function startProgress(){

progress.style.display="block";

progressFill.style.width="0%";

let value=0;

const timer=setInterval(()=>{

value+=2;

progressFill.style.width=value+"%";

if(value>=100){

clearInterval(timer);

}

},120);

}



// Reset Progress

function resetProgress(){

progressFill.style.width="0%";

progress.style.display="none";

}



// Disable Button

function disableButton(){

const btn=form.querySelector("button");

btn.disabled=true;

btn.innerHTML="⏳ Processing Video...";

}



// Enable Button

function enableButton(){

const btn=form.querySelector("button");

btn.disabled=false;

btn.innerHTML="✨ Generate Viral Metadata";

}



// Submit


</script>

<script>

//==============================
// Toast Notification
//==============================

function toast(message,color="#10b981"){

const old=document.querySelector(".toast");

if(old) old.remove();

const div=document.createElement("div");

div.className="toast";

div.innerHTML=message;

div.style.cssText=`

position:fixed;
top:30px;
right:30px;
background:${color};
color:white;
padding:15px 22px;
border-radius:12px;
font-weight:600;
z-index:99999;
box-shadow:0 15px 35px rgba(0,0,0,.3);
animation:slide .35s ease;

`;

document.body.appendChild(div);

setTimeout(()=>{

div.remove();

},3000);

}

//==============================
// Animation
//==============================

const style=document.createElement("style");

style.innerHTML=`

@keyframes slide{

from{

opacity:0;
transform:translateX(60px);

}

to{

opacity:1;
transform:translateX(0);

}

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.results{

animation:fadeUp .6s ease;

}

`;

document.head.appendChild(style);

//==============================
// Copy Description
//==============================

const copyBtn=document.querySelector(".copy");

copyBtn.addEventListener("click",()=>{

const txt=document.getElementById("description").innerText;

navigator.clipboard.writeText(txt);

toast("✅ Description Copied");

});

//==============================
// Download TXT
//==============================

document.querySelector(".download").addEventListener("click",()=>{

let titles="";

document.querySelectorAll("#titles li").forEach(li=>{

titles+=li.innerText+"\n";

});

let tags="";

document.querySelectorAll(".tag").forEach(tag=>{

tags+=tag.innerText+" ";

});

const text=`

====================

AI VIRAL METADATA

====================


Titles

--------------------

${titles}


Description

--------------------

${document.getElementById("description").innerText}


Tags

--------------------

${tags}

`;

const blob=new Blob([text],{

type:"text/plain"

});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="metadata.txt";

a.click();

toast("⬇ Metadata Downloaded");

});

//==============================
// Render Results
//==============================

function renderResults(data){

const results=document.querySelector(".results");

const titles=document.getElementById("titles");

const desc=document.getElementById("description");

const tags=document.getElementById("tags");

titles.innerHTML="";

tags.innerHTML="";

data.titles.forEach(title=>{

const li=document.createElement("li");

li.innerHTML=title;

titles.appendChild(li);

});

desc.innerHTML=data.description;

data.tags.forEach(tag=>{

const span=document.createElement("span");

span.className="tag";

span.innerHTML=tag.startsWith("#")?tag:"#"+tag;

tags.appendChild(span);

});

results.style.display="block";

results.scrollIntoView({

behavior:"smooth"

});

toast("🎉 Metadata Generated Successfully");

enableButton();

resetProgress();

}

//==============================
// Error Function
//==============================

function showError(msg){

toast(msg,"#ef4444");

enableButton();

resetProgress();

}

</script>
<script>

//====================================
// Gemini API Settings
//====================================

const MODEL_NAME = "gemini-2.5-flash";

async function fileToFrames(file, frameCount = 3) {

    return new Promise((resolve, reject) => {

        const video = document.createElement("video");

        video.preload = "metadata";
        video.src = URL.createObjectURL(file);
        video.muted = true;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        video.onloadedmetadata = async () => {

            try {

                const frames = [];

                const duration = video.duration;

                canvas.width = 640;
                canvas.height = 360;

                for (let i = 1; i <= frameCount; i++) {

                    const seekTime = (duration / (frameCount + 1)) * i;

                    await new Promise((done) => {

                        video.currentTime = seekTime;

                        video.onseeked = () => {

                            ctx.drawImage(
                                video,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );

                            const img = canvas
                                .toDataURL("image/jpeg", 0.85)
                                .split(",")[1];

                            frames.push(img);

                            done();

                        };

                    });

                }

                URL.revokeObjectURL(video.src);

                resolve(frames);

            } catch (err) {

                reject(err);

            }

        };

        video.onerror = () => {

            reject("Unable to load video.");

        };

    });

}

//====================================
// Prompt Builder
//====================================

function buildPrompt(platform, filename) {

return `

Analyze the uploaded video frames.

Video Name:
${filename}

Platform:
${platform}

Generate ONLY valid JSON.

{
"title":[
"",
"",
""
],

"description":"",

"tags":[
"",
"",
"",
""
]

}

Requirements:

- High CTR
- SEO Optimized
- Roman Urdu + English
- Trending Keywords
- Powerful Hook
- CTA Included
- No Markdown
- JSON only

`;

}

//====================================
// Prepare API Parts
//====================================

async function prepareParts(file, platform){

const frames = await fileToFrames(file);

const parts=[];

parts.push({

text:buildPrompt(

platform,

file.name

)

});

frames.forEach(frame=>{

parts.push({

inlineData:{

mimeType:"image/jpeg",

data:frame

}

});

});

return parts;

}

</script>
<script>

//==========================================
// Gemini API Call
//==========================================

async function generateMetadata() {

    try {

        disableButton();
        startProgress();

        const apiKey = document
            .getElementById("apiKey")
            .value
            .trim();

        if (!apiKey) {
            showError("Please enter Gemini API Key.");
            return;
        }

        const file = fileInput.files[0];

        if (!file) {
            showError("Please select a video.");
            return;
        }

        const platform =
            document.getElementById("platform").value;

        const parts = await prepareParts(
            file,
            platform
        );

        const payload = {

            contents: [

                {

                    parts

                }

            ],

            generationConfig: {

                temperature: 0.8,

                topP: 0.95,

                topK: 40,

                maxOutputTokens: 2048,

              responseMimeType:"application/json",
candidateCount:1

            }

        };

        const endpoint =
            `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

        let retries = 3;

        let response;

        while (retries > 0) {

            response = await fetch(endpoint, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(payload)

            });

            if (response.ok) break;

            retries--;

            await new Promise(r =>
                setTimeout(r, 1500)
            );

        }

        if (!response.ok) {

            const err = await response.json();
if (response.status === 429) {
    throw new Error(
        "Gemini Free API quota exceeded. Please wait for the quota reset or use a new API key."
    );
}

if (response.status === 403) {
    throw new Error(
        "Your Gemini project does not have access. Check your API key or Google AI Studio project."
    );
}
          throw new Error(
    err.error?.message ||
    err.error?.status ||
    "Unable to contact Gemini API."
);

        }

        const data = await response.json();
        finishLoading();
        processGeminiResponse(data);

    }

    catch (err) {

        console.error(err);

        showError(err.message);

    }

}



form.addEventListener("submit",function(e){

    e.preventDefault();

    generateMetadata();

});

</script>
<script>

//==========================================
// Gemini Response Parser
//==========================================

function processGeminiResponse(data){

try{

if(
!data.candidates ||
!data.candidates.length
){

throw new Error("No response received from Gemini.");

}

let text=data.candidates[0].content.parts[0].text;

// Remove markdown if present

text=text.replace(/```json/g,"");
text=text.replace(/```/g,"");
text=text.trim();

// Parse JSON

const json=JSON.parse(text);

// Accept both title and titles

const titles=json.titles || json.title || [];

const description=json.description || "";

const tags=json.tags || [];

if(
titles.length===0 ||
description===""
){

throw new Error("Invalid AI response.");

}

renderResults({

titles,

description,

tags

});

}
catch(err){

console.error(err);

showError(
"Unable to parse Gemini response."
);

}

}

//==========================================
// Better Error Messages
//==========================================

window.addEventListener("unhandledrejection",function(e){

console.error(e.reason);

showError(

e.reason?.message ||

"Unexpected Error"

);

});

window.addEventListener("error",function(e){

console.error(e.error);

showError(

"JavaScript Error"

);

});

//==========================================
// Progress Finish
//==========================================

function finishLoading(){

progressFill.style.width="100%";

setTimeout(()=>{

resetProgress();

},500);

}

// Replace renderResults
//==========================================

}

document
.getElementById("apiKey")

</script>
